<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>계좌 정보 - 관리자</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div th:replace="~{admin/fragments :: header}"></div>
<div class="admin-layout">
    <nav th:replace="~{admin/fragments :: nav(active='account')}"></nav>
    <main class="admin-main">
        <form class="card" th:action="@{/admin/account}" method="post">
            <h2>계좌 정보</h2>
            <div class="grid-2">
                <div>
                    <h3>신랑측</h3>
                    <div class="field"><label>은행</label><input type="text" name="groomBank" th:value="${info.groom.accountBank}"></div>
                    <div class="field"><label>계좌번호</label><input type="text" name="groomAccountNumber" th:value="${info.groom.accountNumber}"></div>
                    <div class="field"><label>예금주</label><input type="text" name="groomOwner" th:value="${info.groom.accountOwner}"></div>
                </div>
                <div>
                    <h3>신부측</h3>
                    <div class="field"><label>은행</label><input type="text" name="brideBank" th:value="${info.bride.accountBank}"></div>
                    <div class="field"><label>계좌번호</label><input type="text" name="brideAccountNumber" th:value="${info.bride.accountNumber}"></div>
                    <div class="field"><label>예금주</label><input type="text" name="brideOwner" th:value="${info.bride.accountOwner}"></div>
                </div>
            </div>
            <button type="submit" class="btn">저장하기</button>
        </form>
    </main>
</div>
</body>
</html>
