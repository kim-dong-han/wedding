<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>오프닝 - 관리자</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div th:replace="~{admin/fragments :: header}"></div>
<div class="admin-layout">
    <nav th:replace="~{admin/fragments :: nav(active='animation')}"></nav>
    <main class="admin-main">
        <form class="card" th:action="@{/admin/animation}" method="post">
            <h2>오프닝 애니메이션</h2>
            <div class="field">
                <label style="display:flex; align-items:center; gap:8px; text-transform:none">
                    <input type="checkbox" name="enabled" value="true" th:checked="${info.openingAnimation.enabled}" style="width:auto">
                    오프닝 애니메이션 사용
                </label>
            </div>
            <div class="field">
                <label>메인 텍스트</label>
                <input type="text" name="text" th:value="${info.openingAnimation.text}" placeholder="저희 두 사람, 결혼합니다">
            </div>
            <div class="field">
                <label>서브 텍스트</label>
                <input type="text" name="subtext" th:value="${info.openingAnimation.subtext}" placeholder="W E   G E T   M A R R I E D">
            </div>
            <button type="submit" class="btn">저장하기</button>
        </form>
    </main>
</div>
</body>
</html>
