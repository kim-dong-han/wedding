<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>배경음악 - 관리자</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div th:replace="~{admin/fragments :: header}"></div>
<div class="admin-layout">
    <nav th:replace="~{admin/fragments :: nav(active='bgm')}"></nav>
    <main class="admin-main">
        <form class="card" th:action="@{/admin/bgm}" method="post">
            <h2>배경 음악</h2>
            <div class="field">
                <label style="display:flex; align-items:center; gap:8px; text-transform:none">
                    <input type="checkbox" name="enabled" value="true" th:checked="${info.bgm.enabled}" style="width:auto">
                    배경 음악 사용
                </label>
            </div>
            <div class="field">
                <label>음악 제목</label>
                <input type="text" name="title" th:value="${info.bgm.title}" placeholder="곡 제목">
            </div>
            <div class="field">
                <label>음악 URL (MP3)</label>
                <input type="text" name="url" th:value="${info.bgm.url}" placeholder="https://example.com/music.mp3">
            </div>
            <button type="submit" class="btn">저장하기</button>
        </form>
    </main>
</div>
</body>
</html>
